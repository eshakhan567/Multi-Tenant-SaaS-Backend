services:
  - type: web
    name: multitenant-saas-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn multitenant_backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multitenant-saas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: multitenant-saas-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: multitenant_backend.settings
      - key: PYTHON_VERSION
        value: 3.12.3

  - type: redis
    name: multitenant-saas-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: worker
    name: multitenant-saas-worker
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "celery -A multitenant_backend.celery_app worker --loglevel=info"

databases:
  - name: multitenant-saas-db
    databaseName: multitenant_backend
    plan: free